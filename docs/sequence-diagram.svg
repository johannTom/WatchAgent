<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">WatchAgent poll and event detection sequence</title>
  <desc id="desc">Sequence diagram for storing a new reading and running event detection.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e6e6e6" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#000" stroke-width="1.5"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #000; }
      .subtitle { font: 400 13px Arial, sans-serif; fill: #333; }
      .lifeline { stroke: #000; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .msg { stroke: #000; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .ret { stroke: #000; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .box { fill: #fff; stroke: #000; stroke-width: 1.5; }
      .actor { fill: #fff; stroke: #000; stroke-width: 1.5; }
      .label { font: 400 12px Arial, sans-serif; fill: #000; }
      .head { font: 600 13px Arial, sans-serif; fill: #000; text-anchor: middle; }
      .frame { fill: none; stroke: #000; stroke-width: 1.5; }
      .note { font: italic 12px Arial, sans-serif; fill: #333; }
    </style>
  </defs>

  <rect width="1100" height="720" fill="#ffffff"/>
  <rect width="1100" height="720" fill="url(#grid)"/>
  <text x="40" y="40" class="title">WatchAgent - Poll and Event Detection Sequence</text>
  <text x="40" y="62" class="subtitle">For each city: fetch, dedupe, store reading, evaluate events</text>

  <!-- Participants -->
  <rect x="40" y="90" width="120" height="36" class="actor"/>
  <text x="100" y="113" class="head">WeatherPoller</text>
  <line x1="100" y1="126" x2="100" y2="660" class="lifeline"/>

  <rect x="230" y="90" width="130" height="36" class="box"/>
  <text x="295" y="113" class="head">OpenMeteoAPI</text>
  <line x1="295" y1="126" x2="295" y2="660" class="lifeline"/>

  <rect x="430" y="90" width="110" height="36" class="box"/>
  <text x="485" y="113" class="head">Repository</text>
  <line x1="485" y1="126" x2="485" y2="660" class="lifeline"/>

  <rect x="610" y="90" width="150" height="36" class="box"/>
  <text x="685" y="113" class="head">WeatherDatabase</text>
  <line x1="685" y1="126" x2="685" y2="660" class="lifeline"/>

  <rect x="830" y="90" width="120" height="36" class="box"/>
  <text x="890" y="113" class="head">EventDetector</text>
  <line x1="890" y1="126" x2="890" y2="660" class="lifeline"/>

  <!-- loop frame -->
  <rect x="25" y="145" width="960" height="500" class="frame"/>
  <text x="35" y="165" class="label">loop [for each city]</text>

  <!-- Messages -->
  <line x1="100" y1="190" x2="295" y2="190" class="msg"/>
  <text x="130" y="182" class="label">GET current weather</text>
  <line x1="295" y1="215" x2="100" y2="215" class="ret"/>
  <text x="130" y="207" class="label">JSON payload</text>

  <line x1="100" y1="250" x2="485" y2="250" class="msg"/>
  <text x="170" y="242" class="label">store_reading_if_new(...)</text>
  <line x1="485" y1="275" x2="685" y2="275" class="msg"/>
  <text x="520" y="267" class="label">check duplicate</text>
  <line x1="685" y1="300" x2="485" y2="300" class="ret"/>
  <text x="520" y="292" class="label">exists / not found</text>

  <!-- alt frame -->
  <rect x="40" y="320" width="930" height="300" class="frame"/>
  <line x1="40" y1="350" x2="970" y2="350" class="frame"/>
  <text x="50" y="340" class="label">alt</text>
  <text x="60" y="368" class="label">[duplicate]</text>
  <text x="60" y="395" class="label">skip</text>
  <text x="500" y="368" class="label">[new reading]</text>

  <line x1="485" y1="420" x2="685" y2="420" class="msg"/>
  <text x="520" y="412" class="label">INSERT Reading</text>
  <line x1="685" y1="445" x2="485" y2="445" class="ret"/>
  <text x="520" y="437" class="label">committed</text>
  <line x1="485" y1="470" x2="100" y2="470" class="ret"/>
  <text x="170" y="462" class="label">Reading</text>

  <line x1="100" y1="505" x2="890" y2="505" class="msg"/>
  <text x="430" y="497" class="label">evaluate_reading(db, reading)</text>
  <line x1="890" y1="530" x2="485" y2="530" class="msg"/>
  <text x="560" y="522" class="label">get_previous_reading(city)</text>
  <line x1="485" y1="555" x2="685" y2="555" class="msg"/>
  <text x="520" y="547" class="label">SELECT prior reading</text>
  <line x1="890" y1="580" x2="485" y2="580" class="msg"/>
  <text x="560" y="572" class="label">store_event(...) for each match</text>
  <line x1="485" y1="605" x2="685" y2="605" class="msg"/>
  <text x="520" y="597" class="label">INSERT Event</text>
</svg>
