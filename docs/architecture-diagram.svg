<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">WatchAgent architecture diagram</title>
  <desc id="desc">Architecture diagram showing Open-Meteo feeding a weather poller, which writes readings to SQLite and sends readings to event detection. Event detection stores notable events in SQLite. A client calls FastAPI, which queries SQLite and returns JSON responses. The client does not access the database directly.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#25485f" />
    </marker>
    <style>
      .bg { fill: #f7f4ee; }
      .title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #1f2a33; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #5b6870; }
      .label { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #1f2a33; }
      .body { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #44515a; }
      .small { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #44515a; }
      .box { rx: 22; ry: 22; stroke: #25485f; stroke-width: 2.5; }
      .external { fill: #fff8e8; }
      .process { fill: #eef6f9; }
      .storage { fill: #f3efe7; }
      .api { fill: #e9f4ee; }
      .actor { fill: #f8ecec; }
      .arrow { stroke: #25485f; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 10 8; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760" />

  <text x="70" y="70" class="title">WatchAgent Architecture</text>
  <text x="70" y="100" class="subtitle">Weather data is fetched, filtered into notable events, stored in SQLite, and exposed through a FastAPI service.</text>

  <rect x="90" y="180" width="250" height="120" class="box external" />
  <text x="125" y="230" class="label">Open-Meteo API</text>
  <text x="125" y="258" class="body">External weather source</text>
  <text x="125" y="280" class="body">Current conditions for 3 cities</text>

  <rect x="430" y="180" width="290" height="120" class="box process" />
  <text x="468" y="230" class="label">Weather Poller</text>
  <text x="468" y="258" class="body">Fetches Ottawa, Toronto, Vancouver</text>
  <text x="468" y="280" class="body">Skips duplicate timestamps per city</text>

  <rect x="430" y="390" width="290" height="120" class="box process" />
  <text x="460" y="440" class="label">Event Detection Logic</text>
  <text x="460" y="468" class="body">Evaluates weather changes and thresholds</text>
  <text x="460" y="490" class="body">Decides whether an event is notable</text>

  <rect x="830" y="280" width="280" height="170" class="box storage" />
  <text x="930" y="330" text-anchor="middle" class="label">SQLite Database</text>
  <text x="890" y="365" class="body">Stores readings</text>
  <text x="890" y="392" class="body">Stores notable events</text>
  <text x="890" y="419" class="body">Supports query endpoints</text>

  <rect x="430" y="600" width="290" height="110" class="box api" />
  <text x="525" y="646" class="label">FastAPI Service</text>
  <text x="485" y="674" class="body">/health  /readings  /events</text>

  <rect x="860" y="600" width="240" height="110" class="box actor" />
  <text x="930" y="646" class="label">Client / Reviewer</text>
  <text x="907" y="674" class="body">Calls the HTTP API</text>

  <path d="M 340 240 L 430 240" class="arrow" />
  <path d="M 575 300 L 575 390" class="arrow" />
  <path d="M 720 240 L 830 320" class="arrow" />
  <path d="M 720 450 L 830 410" class="arrow" />
  <path d="M 690 600 L 770 520 L 920 520 L 920 450" class="arrow dashed" />
  <path d="M 860 662 L 720 662" class="arrow" />
  <path d="M 720 628 L 860 628" class="arrow" />

  <text x="355" y="220" class="small">poll current data</text>
  <text x="592" y="350" class="small">evaluate readings</text>
  <text x="738" y="265" class="small">store readings</text>
  <text x="738" y="438" class="small">store events</text>
  <text x="760" y="505" class="small">query stored data</text>
  <text x="742" y="612" class="small">request endpoints</text>
  <text x="748" y="690" class="small">JSON responses</text>
</svg>
