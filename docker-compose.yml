# Date: 2026-05-29
# What this file does: runs the app locally in Docker; keeps the sqlite db in ./data so data survives restarts.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
